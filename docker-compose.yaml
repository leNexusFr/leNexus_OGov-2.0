version: '3.1'
services:
  db_kusama:
    image: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - kusama_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    container_name: kusama-opengov-postgres

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kusama-opengov-container
    volumes:
      - ./vol:/app/data/
      - ./assets:/app/assets
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - db_kusama
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kusama_postgres_data: